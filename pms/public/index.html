.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:9px 16px;border:1px solid var(--vr-n-300);border-radius:8px;background:var(--vr-input);font-size:14px;font-weight:500;color:var(--vr-n-700);cursor:pointer;transition:background-color .15s}
.gbtn svg{width:18px;height:18px}.gbtn:hover:not(:disabled){background:var(--vr-n-50)}.gbtn:disabled{opacity:.6;cursor:not-allowed}
.ac-note{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 0;font-size:12px;color:var(--vr-n-500)}
.ac-note svg{width:14px;height:14px;color:var(--vr-success-600)}.ac-note b{color:var(--vr-n-700)}
.ac-alert{display:flex;align-items:flex-start;gap:8px;margin:20px 0 0;padding:10px 12px;border:1px solid;border-radius:12px;font-size:14px}
.ac-alert svg{width:16px;height:16px;margin-top:2px}
.ac-alert.err{border-color:var(--vr-danger-200);background:var(--vr-danger-50);color:var(--vr-danger-700)}
.ac-alert.info{border-color:var(--vr-navy-100);background:var(--vr-navy-50);color:var(--vr-info-text)}
.auth-demo{margin-top:24px;padding:12px;border:1px dashed var(--vr-n-300);border-radius:12px;background:var(--vr-n-50)}
.adm-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-size:12px;color:var(--vr-n-800)}
.adm-h svg{width:14px;height:14px;color:var(--vr-warn-600)}
.adm-h span{margin-left:auto;color:var(--vr-n-500)}
.adm-h code{margin-left:4px;padding:1px 6px;border:1px solid var(--vr-n-200);border-radius:6px;background:var(--vr-card);font:600 11px ui-monospace,Consolas,monospace;color:var(--vr-n-800)}
.adm-row{display:grid;grid-template-columns:100px 1fr 14px;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:6px;background:none;text-align:left;font-size:12px;color:var(--vr-n-700);cursor:pointer;transition:background-color .15s}
.adm-row:hover,.adm-row:focus-visible{background:var(--vr-card);outline:none}
.adm-l{font-weight:600;line-height:1.25;color:var(--vr-n-900)}.adm-l small{display:block;font-weight:400;font-size:11px;color:var(--vr-n-500)}
.adm-e{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--vr-n-600)}
.adm-row svg{width:14px;height:14px;color:var(--vr-n-400)}
.auth-demo p{margin:6px 4px 0;font-size:11px;color:var(--vr-n-500)}
.auth-legal{margin-top:24px;text-align:center;font-size:12px;color:var(--vr-n-500)}
.login{max-width:480px;margin:10vh auto;padding:0 16px}

/* ---- login left panel: navy, drifting glows, dot grid, floating review preview ---- */
.auth-brand .o1{width:420px;height:420px;right:-140px;top:-120px;opacity:.55;animation:lvDrift 18s ease-in-out infinite alternate}
.auth-brand .o2{width:520px;height:520px;left:-180px;bottom:-200px;opacity:.45;animation:lvDrift 22s ease-in-out infinite alternate-reverse}
.auth-brand .ab-in{position:relative;z-index:1}
.auth-brand .ab-mid>*{animation:lvUp .6s cubic-bezier(.2,.7,.2,1) both}
.auth-brand .ab-mid>:nth-child(2){animation-delay:.08s}.auth-brand .ab-mid>:nth-child(3){animation-delay:.16s}.auth-brand .ab-mid>:nth-child(4){animation-delay:.24s}.auth-brand .ab-mid>:nth-child(5){animation-delay:.32s}
.auth-form{animation:lvUp .6s .1s cubic-bezier(.2,.7,.2,1) both}
@keyframes lvUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lvDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.08)}}
@keyframes lvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* a floating mock of the monthly review: card and corner cards float together as one piece (no separate wobble) */
.lvb-mid{max-width:460px}
.lvb-stage{margin:30px 0 8px;padding:46px 0 26px}
.lvb-float{position:relative;animation:lvFloat 8s ease-in-out infinite;will-change:transform}
.lvb-card{padding:18px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.08);box-shadow:0 24px 48px -16px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lvb-h{display:flex;align-items:center;gap:12px}
.lvb-h b{display:block;font-size:14px;line-height:20px;color:#fff}.lvb-h small{font-size:12px;color:rgba(255,255,255,.6)}
.lvb-av{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12)}.lvb-av svg{width:18px;height:18px}
.lvb-badge{display:inline-flex;align-items:center;gap:5px;margin-left:auto;padding:3px 10px 3px 8px;border-radius:9999px;background:var(--vr-success-500);font-size:12px;font-weight:600;color:#fff;opacity:0;transform:scale(.8);animation:lvPop .4s 1.9s cubic-bezier(.3,1.6,.5,1) forwards}
.lvb-badge svg{width:13px;height:13px;stroke-width:3}
@keyframes lvPop{to{opacity:1;transform:none}}
.lvb-body{display:flex;align-items:center;gap:22px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.lvb-ring{position:relative;flex:none;width:112px;height:112px}
.lvb-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.lvb-ring circle{fill:none;stroke-width:10}.lvb-ring .t{stroke:rgba(255,255,255,.12)}
.lvb-ring .v{stroke:var(--vr-success-500);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:lvRing 1.4s .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes lvRing{to{stroke-dashoffset:14}}
.lvb-ring>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.lvb-ring b{font-size:26px;line-height:30px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}.lvb-ring small{font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.6)}
.lvb-bars{flex:1;margin:0;padding:0;list-style:none}
.lvb-bars li+li{margin-top:12px}
.lvb-bars span{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:rgba(255,255,255,.75)}.lvb-bars em{font-style:normal;font-weight:600;color:#fff}
.lvb-bars i{display:block;height:6px;margin-top:6px;border-radius:9999px;background:rgba(255,255,255,.12);overflow:hidden}
.lvb-bars s{display:block;width:0;height:100%;border-radius:9999px;background:rgba(255,255,255,.85);animation:lvBar 1s calc(.7s + var(--i) * .15s) cubic-bezier(.2,.7,.2,1) forwards}
@keyframes lvBar{to{width:var(--w)}}
.lvb-chip{position:absolute;display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:12px;background:var(--vr-card);box-shadow:0 16px 32px -12px rgba(0,0,0,.5);opacity:0;animation:lvChip .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes lvChip{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.lvb-chip svg{flex:none;box-sizing:content-box;width:16px;height:16px;padding:7px;border-radius:8px;background:var(--vr-navy-50);color:var(--vr-brand-text)}
.lvb-chip b{display:block;font-size:12px;line-height:16px;color:var(--vr-n-900)}.lvb-chip small{display:block;font-size:11px;line-height:15px;color:var(--vr-n-500)}
.lvb-chip.c1{right:-28px;top:-50px;animation-delay:1.2s}
.lvb-chip.c2{left:-24px;bottom:-20px;animation-delay:1.5s}
.lvb-chip.c2 svg{background:var(--vr-success-50);color:var(--vr-success-700)}
.lvb-car{margin-top:26px}
.lvb-slides{display:grid}
.lvb-slides p{grid-area:1/1;margin:0;font-size:14px;line-height:22px;color:rgba(255,255,255,.72);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.lvb-slides p.on{opacity:1;transform:none}
.lvb-slides b{display:block;margin-bottom:2px;font-size:16px;color:#fff}
.lvb-dots{display:flex;gap:6px;margin-top:16px}
.lvb-dots button{width:8px;height:8px;padding:0;border:0;border-radius:9999px;background:rgba(255,255,255,.3);cursor:pointer;transition:width .3s,background-color .3s}
.lvb-dots button.on{width:24px;background:#fff}
.lvb-dots button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* faint dot grid behind the panel, fading out towards the bottom right */
.auth-brand::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(160deg,#000 0%,transparent 70%);mask-image:linear-gradient(160deg,#000 0%,transparent 70%);pointer-events:none}
@media(prefers-reduced-motion:reduce){.auth *,.auth *::before,.auth *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
@media(max-width:767px){.auth-brand{display:none}.auth-logo{display:block}}

/* =====================================================================
   Employee dashboard: welcome header, "My review" card with labelled rows, to-do list + how it works
   ===================================================================== */
.ehd{display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px}
.ecard{margin-bottom:20px;overflow:hidden;border:1px solid var(--vr-n-200);border-radius:12px;background:var(--vr-card);box-shadow:var(--vr-shadow)}
.ecard-h{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:18px 24px;border-bottom:1px solid var(--vr-n-200);background:var(--vr-n-50)}
.ecard-h h2{margin:0;font-size:17px;line-height:24px;font-weight:700;color:var(--vr-n-900)}
.ecard-h p{margin:2px 0 0;font-size:14px;line-height:20px;color:var(--vr-n-600)}
.ecard-h.sm{padding:13px 20px}.ecard-h.sm h2{font-size:15px;line-height:22px}
.kvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0}
.kv{min-width:0;padding:16px 24px;border-right:1px solid var(--vr-n-100);border-bottom:1px solid var(--vr-n-100)}
.kv:nth-child(3n){border-right:0}.kv:nth-last-child(-n+3){border-bottom:0}
.kv dt{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--vr-n-500)}
.kv dd{margin:6px 0 0;font-size:15px;line-height:22px;font-weight:600;color:var(--vr-n-900);font-variant-numeric:tabular-nums}
.kv dd small{display:block;margin-top:2px;font-size:12px;line-height:16px;font-weight:400;color:var(--vr-n-500)}
.egrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.egrid .ecard{margin-bottom:0}
.todo{margin:0;padding:0;list-style:none;counter-reset:todo}
.todo li{display:flex;gap:12px;padding:11px 20px;border-bottom:1px solid var(--vr-n-100);font-size:14px;line-height:22px;color:var(--vr-n-800);counter-increment:todo}
.todo li:last-child{border-bottom:0}
.todo li::before{content:counter(todo);flex:none;width:22px;height:22px;border:1px solid var(--vr-n-300);border-radius:9999px;text-align:center;font-size:11px;line-height:20px;font-weight:600;color:var(--vr-n-600)}
.ebox{margin:16px 20px;padding:10px 12px;border:1px solid;border-radius:8px;font-size:14px}
.steps{margin:0;padding:16px 20px 4px 40px;font-size:14px;line-height:21px;color:var(--vr-n-700)}
.steps li{margin-bottom:12px}.steps li::marker{font-weight:600;color:var(--vr-n-500)}.steps b{color:var(--vr-n-900)}
.enote{margin:0 20px 18px;padding-top:12px;border-top:1px solid var(--vr-n-100);font-size:12px;line-height:18px;color:var(--vr-n-500)}
@media(max-width:1000px){
  .egrid{grid-template-columns:1fr}
  .kvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv:nth-child(n){border-right:1px solid var(--vr-n-100);border-bottom:1px solid var(--vr-n-100)}
  .kv:nth-child(2n){border-right:0}.kv:nth-last-child(-n+2){border-bottom:0}
}
@media(max-width:560px){.kvgrid{grid-template-columns:1fr}.kv:nth-child(n){border-right:0}.kv:nth-last-child(2){border-bottom:1px solid var(--vr-n-100)}.ecard-h{padding:16px}.kv{padding:14px 16px}}

/* =====================================================================
   Print
   ===================================================================== */
@media print{
  .side,.topbar,.ibtn,.tabs,.btn,.toast{display:none!important}
  #app{display:block;height:auto;overflow:visible}#main{overflow:visible;padding:0}
  body{background:#fff}.tablewrap,.card,.m{box-shadow:none}
}
